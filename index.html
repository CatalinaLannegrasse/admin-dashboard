<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="dashboard-container">
        
<!-- 1. Sidebar Container -->
<aside class="sidebar">
    <!-- Branding / Logo Section -->
    <div class="sidebar-brand">
        <!-- You can use an SVG or inline icon/emoji here for now -->
        <img src="images/view-dashboard.svg" alt="Dashboard Icon" class="brand-icon">
        <h1 class="brand-title">Dashboard</h1>
    </div>

    <!-- Main Navigation Links -->
    <ul class="nav-links main-nav">
        <li><a href="#"><img src="images/home.svg" alt="Home icon" class="icon"> Home</a></li>
        <li><a href="#"><img src="images/account.svg" alt="Home icon" class="icon"> Profile</a></li>
        <li><a href="#"><img src="images/message.svg" alt="Home icon" class="icon"> Messages</a></li>
        <li><a href="#"><img src="images/history.svg" alt="Home icon" class="icon"> History</a></li>
        <li><a href="#"><img src="images/file-multiple.svg" alt="Home icon" class="icon"> Tasks</a></li>
        <li><a href="#"><img src="images/account-multiple.svg" alt="Home icon" class="icon"> Communities</a></li>
    </ul>

    <!-- Secondary Navigation Links (Settings, Support, Privacy) -->
    <ul class="nav-links secondary-nav">
        <li><a href="#"><img src="images/cog.svg" alt="Home icon" class="icon"> Settings</a></li>
        <li><a href="#"><img src="images/help-box.svg" alt="Home icon" class="icon"> Support</a></li>
        <li><a href="#"><img src="images/security.svg" alt="Home icon" class="icon"> Privacy</a></li>
    </ul>
</aside>

        <!-- 2. Header Container -->
        <header class="header">
            <!-- Search bar, user profile, notifications, and action buttons will go here -->
        </header>

        <!-- 3. Main Content Container -->
        <main class="main-content">
            <!-- Projects, announcements, and trending sections will go here -->
        </main>

    </div>
</body>
</html>
